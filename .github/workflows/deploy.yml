name: Deploy to OVH (FTP)

on:
  push:
    branches:
      - prod
  workflow_dispatch:

concurrency:
  group: deploy-ovh-prod
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build static export
        run: npm run build

      - name: Deploy out/ to OVH via SFTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT || 22 }}
        run: |
          sudo apt-get install -y -qq lftp
          timeout 600 lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "sftp://$FTP_SERVER:$FTP_PORT" \
            -e "set sftp:auto-confirm yes; set net:timeout 20; set net:max-retries 2; mirror -R --verbose ./out/ www/; bye"
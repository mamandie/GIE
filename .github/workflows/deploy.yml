name: Deploy to OVH (FTP)

on:
  push:
    branches:
      - prod
  workflow_dispatch:

concurrency:
  group: deploy-ovh-prod
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build static export
        run: npm run build

      - name: Deploy out/ to OVH via SFTP
        uses: pressidium/lftp-mirror-action@v1
        with:
          host: ${{ secrets.FTP_SERVER }}
          port: ${{ secrets.FTP_PORT || '22' }}
          user: ${{ secrets.FTP_USERNAME }}
          pass: ${{ secrets.FTP_PASSWORD }}
          localDir: './out'
          remoteDir: 'www/'
          reverse: 'true'
          onlyNewer: 'false'
          restoreMTime: 'false'
          settings: 'sftp:auto-confirm=yes'
          options: '--verbose'